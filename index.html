<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookingBrother</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    -webkit-tap-highlight-color: transparent;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--tg-theme-hint-color, #666);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
  }
  .cell {
    padding: 12px 8px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f4);
    color: var(--tg-theme-text-color, #000);
    cursor: pointer;
    text-align: center;
    font-size: 14px;
    line-height: 1.3;
    transition: transform 0.05s;
    user-select: none;
  }
  .cell:active { transform: scale(0.97); }
  .cell.disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }
  .cell.disabled:active { transform: none; }
  .halls .cell {
    padding: 16px;
    text-align: left;
    font-weight: 500;
  }
  .back {
    display: inline-block;
    background: transparent;
    border: none;
    color: var(--tg-theme-link-color, #2481cc);
    padding: 6px 0 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .summary {
    padding: 16px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f4);
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 15px;
    line-height: 1.6;
  }
  .summary div { margin: 2px 0; }
  .empty, .loading {
    color: var(--tg-theme-hint-color, #999);
    font-size: 14px;
    padding: 40px 12px;
    text-align: center;
  }
  .error {
    color: #d63d3d;
    padding: 16px;
    background: rgba(214, 61, 61, 0.08);
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .hint {
    color: var(--tg-theme-hint-color, #999);
    font-size: 12px;
    margin: -12px 0 12px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) {
    document.getElementById('app').innerHTML =
      '<div class="error">This page must be opened from inside Telegram.</div>';
    return;
  }
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(location.search);
  const apiURL = params.get('api'); // may be null → skip live availability
  let halls = [];
  try {
    halls = JSON.parse(params.get('halls') || '[]');
  } catch (_) { halls = []; }

  const state = {
    hall: null,
    day: null,
    duration: null,
    time: null,
    bookedSlots: [],       // filled after fetching availability
    availabilityFor: null, // "hallID|date" cache key
  };
  const app = document.getElementById('app');

  function clearMainButton() {
    tg.MainButton.hide();
    tg.MainButton.offClick(submit);
  }

  function render() {
    app.innerHTML = '';
    clearMainButton();
    if (!state.hall) return renderHalls();
    if (!state.day) return renderDays();
    if (!state.duration) return renderDurations();
    if (!state.time) return renderTimes();
    return renderConfirm();
  }

  function renderHalls() {
    if (halls.length === 0) {
      app.innerHTML =
        '<div class="empty">No halls available for your city.<br>' +
        'Send <b>/coordinates</b> to the bot first.</div>';
      return;
    }
    app.appendChild(el('h2', 'Choose a hall'));
    const grid = el('div', '', 'grid halls');
    halls.forEach(h => {
      const cell = el('div', '🏓 ' + (h.address || h.id), 'cell');
      cell.onclick = () => { state.hall = h; render(); };
      grid.appendChild(cell);
    });
    app.appendChild(grid);
  }

  function renderDays() {
    addBack(() => { state.hall = null; render(); }, 'Back to halls');
    app.appendChild(el('h2', 'Choose a day'));
    const grid = el('div', '', 'grid');
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const now = new Date();
    for (let i = 0; i < 14; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() + i);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dateStr = d.getFullYear() + '.' + mm + '.' + dd;
      const cell = el('div', '', 'cell');
      cell.innerHTML = weekdays[d.getDay()] + '<br>' + dd + '.' + mm;
      cell.onclick = () => pickDay(dateStr);
      grid.appendChild(cell);
    }
    app.appendChild(grid);
  }

  async function pickDay(dateStr) {
    state.day = dateStr;
    // Fetch availability once per (hall, day) pair.
    const key = state.hall.id + '|' + dateStr;
    if (state.availabilityFor !== key) {
      app.innerHTML = '<div class="loading">Loading availability…</div>';
      await fetchAvailability(state.hall.id, dateStr);
      state.availabilityFor = key;
    }
    render();
  }

  async function fetchAvailability(hallID, date) {
    if (!apiURL) { state.bookedSlots = []; return; }
    try {
      const url = apiURL + '?hall_id=' + encodeURIComponent(hallID) +
                           '&date='    + encodeURIComponent(date);
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      state.bookedSlots = Array.isArray(data.booked) ? data.booked : [];
    } catch (e) {
      console.error('availability fetch failed', e);
      state.bookedSlots = []; // fail open — server-side check will still guard
    }
  }

  function renderDurations() {
    addBack(() => { state.day = null; state.availabilityFor = null; render(); }, 'Back to days');
    app.appendChild(el('h2', 'How long?'));
    const grid = el('div', '', 'grid');
    [1, 2, 3].forEach(hrs => {
      const cell = el('div', hrs + ' hour' + (hrs > 1 ? 's' : ''), 'cell');
      cell.onclick = () => { state.duration = hrs; render(); };
      grid.appendChild(cell);
    });
    app.appendChild(grid);
  }

  function renderTimes() {
    addBack(() => { state.duration = null; render(); }, 'Back to duration');
    app.appendChild(el('h2', 'Start time'));
    if (state.bookedSlots.length > 0) {
      app.appendChild(el('div', 'Greyed-out hours already have a booking.', 'hint'));
    }
    const grid = el('div', '', 'grid');
    for (let h = 7; h <= 23; h++) {
      const hh = String(h).padStart(2, '0');
      const cell = el('div', hh + ':00', 'cell');
      if (slotAvailable(h, state.duration)) {
        cell.onclick = () => { state.time = hh; render(); };
      } else {
        cell.classList.add('disabled');
      }
      grid.appendChild(cell);
    }
    app.appendChild(grid);
  }

  function slotAvailable(startHour, duration) {
    const endHour = startHour + duration;
    return !state.bookedSlots.some(b => {
      const bEnd = b.start_hour + b.duration;
      return startHour < bEnd && endHour > b.start_hour;
    });
  }

  function renderConfirm() {
    addBack(() => { state.time = null; render(); }, 'Back to time');
    app.appendChild(el('h2', 'Confirm booking'));
    const s = el('div', '', 'summary');
    s.innerHTML =
      '<div>🏓 <b>' + escapeHTML(state.hall.address || state.hall.id) + '</b></div>' +
      '<div>📅 ' + state.day + '</div>' +
      '<div>⏱ ' + state.time + ':00 · ' + state.duration + ' hour' + (state.duration > 1 ? 's' : '') + '</div>';
    app.appendChild(s);
    tg.MainButton.setText('Confirm booking');
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  }

  function submit() {
    const payload = {
      hall_id:      state.hall.id,
      hall_address: state.hall.address || '',
      date:         state.day,
      time:         state.time,
      duration:     state.duration,
    };
    tg.sendData(JSON.stringify(payload));
    tg.close();
  }

  function addBack(fn, label) {
    const b = el('button', '← ' + label, 'back');
    b.onclick = fn;
    app.appendChild(b);
  }

  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  render();
})();
</script>
</body>
</html>
