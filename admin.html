<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookingBrother Admin — Claim a hall</title>
<script>
  // Debug panel: enabled only when the URL contains ?debug=1. Captures
  // console output + errors to a visible on-page log so Mini App issues can
  // be diagnosed without a browser inspector.
  window.__debugEnabled = /[?&]debug=1(&|$)/.test(location.search);
  if (!window.__debugEnabled) {
    // No-op shim so the rest of the file can still call console.* / __dbgPaint.
    window.__dbgPaint = function () {};
  } else (function () {
    const buf = [];
    function paint() {
      const el = document.getElementById('debug-log');
      if (el) el.textContent = buf.join('\n');
    }
    function record(level, args) {
      const t = new Date().toISOString().slice(11, 19);
      const msg = Array.from(args).map(function (a) {
        if (a instanceof Error) return a.stack || a.message;
        if (typeof a === 'object') { try { return JSON.stringify(a); } catch (_) { return String(a); } }
        return String(a);
      }).join(' ');
      buf.push('[' + t + '] ' + level + ' ' + msg);
      if (buf.length > 60) buf.shift();
      paint();
    }
    ['log', 'info', 'warn', 'error'].forEach(function (lvl) {
      const orig = console[lvl];
      console[lvl] = function () { record(lvl.toUpperCase(), arguments); orig && orig.apply(console, arguments); };
    });
    window.addEventListener('error', function (e) {
      record('ERR', [e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno]);
    });
    window.addEventListener('unhandledrejection', function (e) {
      record('ERR', ['unhandled rejection: ' + (e.reason && e.reason.message || e.reason)]);
    });
    window.__dbgPaint = paint;
    console.log('boot: script 0 ran');
    console.log('UA:', navigator.userAgent);
  })();
</script>
<script src="https://telegram.org/js/telegram-web-app.js" onerror="console.error('telegram-web-app.js failed to load')" onload="console.log('telegram-web-app.js loaded')"></script>
<script>
  // Signal ready to Telegram IMMEDIATELY so the WebView stops its spinner,
  // even if later resources (Leaflet) fail or stall.
  console.log('tg present:', !!(window.Telegram && window.Telegram.WebApp));
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    console.log('tg.ready() + expand() called');
    console.log('initData length:', (window.Telegram.WebApp.initData || '').length);
  }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  onerror="console.error('leaflet.min.js failed to load')"
  onload="console.log('leaflet.min.js loaded, L=' + (typeof L))"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px 100px;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--tg-theme-hint-color, #666);
    margin: 16px 0 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f4);
    color: var(--tg-theme-text-color, #000);
    -webkit-appearance: none;
  }
  input:focus { outline: 2px solid var(--tg-theme-button-color, #2481cc); }
  .hint {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999);
    margin: 6px 0 0;
  }
  #map {
    width: 100%;
    height: 260px;
    border-radius: 10px;
    margin-top: 4px;
  }
  .locate-btn {
    margin-top: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-color, #2481cc);
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
  }
  .photo-wrap {
    position: relative;
    width: 100%;
    min-height: 120px;
    border: 2px dashed var(--tg-theme-hint-color, #ccc);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--tg-theme-secondary-bg-color, #f4f4f4);
    cursor: pointer;
  }
  .photo-wrap input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .photo-wrap img {
    max-width: 100%;
    max-height: 240px;
    display: block;
  }
  .photo-placeholder {
    color: var(--tg-theme-hint-color, #999);
    text-align: center;
    padding: 32px 12px;
    font-size: 14px;
  }
  .submit-area {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: var(--tg-theme-bg-color, #ffffff);
    border-top: 1px solid var(--tg-theme-hint-color, #e0e0e0);
  }
  button.primary {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button.primary[disabled] { opacity: 0.5; cursor: not-allowed; }
  .error {
    color: #d63d3d;
    background: rgba(214, 61, 61, 0.08);
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0;
    font-size: 14px;
  }
  .success {
    color: #2a9d2a;
    background: rgba(42, 157, 42, 0.08);
    border-radius: 10px;
    padding: 16px;
    margin: 20px 0;
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<script>
  // Only render the debug panel when ?debug=1 is on the URL.
  if (window.__debugEnabled) {
    document.write(
      '<pre id="debug-log" style="position:fixed;top:0;left:0;right:0;z-index:9999;' +
      'max-height:40vh;overflow:auto;background:#000;color:#0f0;font:11px/1.3 monospace;' +
      'padding:6px 8px;margin:0;white-space:pre-wrap;border-bottom:2px solid #0f0;"></pre>' +
      '<div style="height:42vh;"></div>'
    );
    if (window.__dbgPaint) window.__dbgPaint();
  }
</script>
<h1>🏓 Claim a hall</h1>
<div id="form">
  <label for="address">Address</label>
  <input id="address" type="text" placeholder="Street, building, etc." maxlength="500" autocomplete="off">

  <label>Location of the hall</label>
  <div id="map"></div>
  <button type="button" id="locate" class="locate-btn">📍 Use my current location</button>
  <p class="hint">Tap or drag the pin to the exact hall location. The city is detected automatically.</p>

  <label for="tables">Number of tables</label>
  <input id="tables" type="number" min="1" max="1000" step="1" inputmode="numeric">

  <label>Photo of the hall</label>
  <div class="photo-wrap" id="photo-wrap">
    <input type="file" id="photo" accept="image/*">
    <div class="photo-placeholder" id="photo-placeholder">Tap to pick a photo</div>
    <img id="photo-preview" style="display:none;" alt="">
  </div>

  <div id="error" class="error" style="display:none;"></div>
</div>
<div id="done" class="success" style="display:none;"></div>

<div class="submit-area">
  <button id="submit" class="primary" type="button">Submit for review</button>
</div>

<script>
(function () {
  console.log('main IIFE: start');
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  console.log('main IIFE: inTelegram=' + inTelegram);
  // tg.ready()/expand() already fired in the <head> inline script.

  const params = new URLSearchParams(location.search);
  const DEFAULT_API_URL = 'https://2r8w1y5bv1.execute-api.eu-north-1.amazonaws.com';
  const apiURL = (params.get('api') || DEFAULT_API_URL).replace(/\/$/, '');
  console.log('apiURL=' + apiURL);

  if (typeof L === 'undefined') {
    console.error('Leaflet L is undefined — map will not render');
  }

  // Default view: broad enough to be useful, admin re-centers via locate button or map tap.
  let marker = null;
  console.log('creating map');
  const map = L.map('map', { zoomControl: true }).setView([41.65, 41.63], 11); // Batumi-ish
  console.log('map created');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap',
  }).addTo(map);
  console.log('tiles added');

  function placeMarker(lat, lon) {
    if (marker) {
      marker.setLatLng([lat, lon]);
    } else {
      marker = L.marker([lat, lon], { draggable: true }).addTo(map);
      marker.on('dragend', () => {
        const ll = marker.getLatLng();
        autoFillAddress(ll.lat, ll.lng);
      });
    }
    autoFillAddress(lat, lon);
  }
  map.on('click', (e) => { placeMarker(e.latlng.lat, e.latlng.lng); });

  // Reverse-geocode the pin to a street-level address and drop it into the
  // address field — but only when the field is empty, so manual edits win.
  // zoom=18 gives building-level detail (vs. zoom=10 the main bot uses for
  // city-only resolution).
  const addrInput = document.getElementById('address');
  let geocodeSeq = 0;
  async function autoFillAddress(lat, lng) {
    if (addrInput.value.trim() !== '') return;
    const seq = ++geocodeSeq;
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json' +
        '&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1&accept-language=en';
      const resp = await fetch(url);
      if (!resp.ok) return;
      const data = await resp.json();
      // Guard against out-of-order responses: a slow earlier call shouldn't
      // overwrite a later pin's result, and we still skip if user has typed.
      if (seq !== geocodeSeq || addrInput.value.trim() !== '') return;
      const formatted = buildAddressFromParts(data && data.address);
      if (formatted) addrInput.value = formatted;
    } catch (e) {
      console.error('reverse geocode failed:', e);
    }
  }

  // Build "<house_number> <road>, <city>, <country>" from Nominatim's
  // structured address, skipping the business/amenity name that
  // display_name usually leads with (e.g. "McShawarma, 15 Rustaveli…" →
  // just "15 Rustaveli…"). Falls back gracefully when parts are missing.
  function buildAddressFromParts(a) {
    if (!a) return '';
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const city = a.city || a.town || a.village || a.state || '';
    const country = a.country || '';
    return [street, city, country].filter(Boolean).join(', ');
  }

  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) { showError('Geolocation not supported by this browser.'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        map.setView([lat, lon], 16);
        placeMarker(lat, lon);
      },
      (err) => showError('Could not get location: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // Photo picker with preview + base64 conversion.
  let photoB64 = null;
  const photoInput = document.getElementById('photo');
  const photoPreview = document.getElementById('photo-preview');
  const photoPlaceholder = document.getElementById('photo-placeholder');
  photoInput.addEventListener('change', () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      showError('Photo too large (max 10 MB).');
      photoInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      photoB64 = reader.result;
      photoPreview.src = photoB64;
      photoPreview.style.display = 'block';
      photoPlaceholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  const submitBtn = document.getElementById('submit');
  submitBtn.addEventListener('click', onSubmit);

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearError() { document.getElementById('error').style.display = 'none'; }

  async function onSubmit() {
    clearError();
    if (!inTelegram) { showError('Please open this page from inside the admin bot.'); return; }

    const address = document.getElementById('address').value.trim();
    const tables = parseInt(document.getElementById('tables').value, 10);
    if (!address) { showError('Address is required.'); return; }
    if (!marker) { showError('Pick a location on the map.'); return; }
    if (!tables || tables < 1) { showError('Enter a valid number of tables.'); return; }
    if (!photoB64) { showError('Pick a photo of the hall.'); return; }

    const { lat, lng } = marker.getLatLng();
    const body = {
      address,
      latitude: lat,
      longitude: lng,
      tables,
      photo: photoB64,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    try {
      const resp = await fetch(apiURL + '/claim-submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Init-Data': tg.initData,
        },
        body: JSON.stringify(body),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        showError(data.error || ('Error ' + resp.status));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit for review';
        return;
      }
      document.getElementById('form').style.display = 'none';
      document.querySelector('.submit-area').style.display = 'none';
      const done = document.getElementById('done');
      done.textContent = '✅ Submitted for review. City: ' + (data.city || '(unknown)');
      done.style.display = 'block';
      setTimeout(() => { tg && tg.close && tg.close(); }, 2500);
    } catch (e) {
      showError('Network error: ' + e.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit for review';
    }
  }
})();
</script>
</body>
</html>
