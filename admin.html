<script>
  // Debug panel: enabled only when the URL contains ?debug=1. Captures
  // console output + errors to a visible on-page log so Mini App issues can
  // be diagnosed without a browser inspector.
  window.__debugEnabled = /[?&]debug=1(&|$)/.test(location.search);
  if (!window.__debugEnabled) {
    // No-op shim so the rest of the file can still call console.* / __dbgPaint.
    window.__dbgPaint = function () {};
  } else (function () {
    const buf = [];
    function paint() {
      const el = document.getElementById('debug-log');
      if (el) el.textContent = buf.join('\n');
    }
    function record(level, args) {
      const t = new Date().toISOString().slice(11, 19);
      const msg = Array.from(args).map(function (a) {
        if (a instanceof Error) return a.stack || a.message;
        if (typeof a === 'object') { try { return JSON.stringify(a); } catch (_) { return String(a); } }
        return String(a);
      }).join(' ');
      buf.push('[' + t + '] ' + level + ' ' + msg);
      if (buf.length > 60) buf.shift();
      paint();
    }
    ['log', 'info', 'warn', 'error'].forEach(function (lvl) {
      const orig = console[lvl];
      console[lvl] = function () { record(lvl.toUpperCase(), arguments); orig && orig.apply(console, arguments); };
    });
    window.addEventListener('error', function (e) {
      record('ERR', [e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno]);
    });
    window.addEventListener('unhandledrejection', function (e) {
      record('ERR', ['unhandled rejection: ' + (e.reason && e.reason.message || e.reason)]);
    });
    window.__dbgPaint = paint;
    console.log('boot: script 0 ran');
    console.log('UA:', navigator.userAgent);
  })();
</script>

<script>

  // even if later resources (Leaflet) fail or stall.
  console.log('tg present:', !!(window.Telegram && window.Telegram.WebApp));

    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    console.log('tg.ready() + expand() called');
    console.log('initData length:', (window.Telegram.WebApp.initData || '').length);
  }
</script>

<script>
(function () {
  console.log('main IIFE: start');
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  console.log('main IIFE: inTelegram=' + inTelegram);
  // tg.ready()/expand() already fired in the <head> inline script.

  const params = new URLSearchParams(location.search);
  const DEFAULT_API_URL = 'https://2r8w1y5bv1.execute-api.eu-north-1.amazonaws.com';
  const apiURL = (params.get('api') || DEFAULT_API_URL).replace(/\/$/, '');
  console.log('apiURL=' + apiURL);

  if (typeof L === 'undefined') {
    console.error('Leaflet L is undefined — map will not render');
  }

  // -------- Screen management --------
  // Views: loading / home / claim / hall / date / bookings. Navigation is
  // one-level deep; "Back" always returns to the previous logical screen.
  const loadingView  = document.getElementById('loading-view');
  const homeView     = document.getElementById('home-view');
  const claimView    = document.getElementById('claim-view');
  const hallView     = document.getElementById('hall-view');
  const dateView     = document.getElementById('date-view');
  const bookingsView = document.getElementById('bookings-view');
  const allViews = [loadingView, homeView, claimView, hallView, dateView, bookingsView];

  // State the subsequent screens read from.
  let currentHall = null;     // {hall_id, address, city}
  let currentHalls = [];      // last-fetched hall list, so showHome can refresh

  function showOnly(view) {
    allViews.forEach((v) => { v.style.display = 'none'; });
    view.style.display = 'block';
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showClaim() {
    showOnly(claimView);
    // Leaflet needs invalidateSize after the map container becomes visible,
    // otherwise tiles render only in a thin strip.
    setTimeout(() => { if (map) map.invalidateSize(); }, 0);
  }
  function showHome(halls) {
    currentHalls = halls || currentHalls;
    const list = document.getElementById('halls-list');
    if (!currentHalls || currentHalls.length === 0) {
      list.innerHTML = '<div class="empty-halls">No halls yet. Tap "Claim a new hall" below.</div>';
    } else {
      list.innerHTML = currentHalls.map((h, i) =>
        '<div class="hall-row" data-idx="' + i + '">' +
          '<div class="addr">' + esc(h.address || '(no address)') + '</div>' +
          '<div class="city">' + esc(h.city || '') + '</div>' +
          '<div class="id">#' + esc(h.hall_id) + '</div>' +
        '</div>'
      ).join('');
      list.querySelectorAll('.hall-row').forEach((el) => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.getAttribute('data-idx'), 10);
          openHall(currentHalls[idx]);
        });
      });
    }
    showOnly(homeView);
  }
  function openHall(hall) {
    currentHall = hall;
    document.getElementById('hall-title').textContent = hall.address || 'Hall';
    document.getElementById('hall-subtitle').textContent =
      (hall.city ? hall.city + ' · ' : '') + '#' + hall.hall_id;
    showOnly(hallView);
  }

  // "YYYY.MM.DD" in the user's local timezone (the format the main bot stores).
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '.' + m + '.' + day;
  }
  function todayStr() { return fmtDate(new Date()); }

  function showDatePicker() {
    const grid = document.getElementById('date-grid');
    const cells = [];
    const now = new Date();
    for (let i = 0; i < 14; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const dateStr = fmtDate(d);
      const label = d.toLocaleDateString(undefined, { weekday: 'short', day: '2-digit' });
      cells.push('<div class="date-cell" data-date="' + dateStr + '">' + esc(label) + '</div>');
    }
    grid.innerHTML = cells.join('');
    grid.querySelectorAll('.date-cell').forEach((el) => {
      el.addEventListener('click', () => {
        showBookings(el.getAttribute('data-date'));
      });
    });
    showOnly(dateView);
  }

  async function showBookings(dateStr) {
    if (!currentHall) return;
    document.getElementById('bookings-title').textContent =
      'Bookings · ' + dateStr;
    document.getElementById('bookings-subtitle').textContent =
      currentHall.address + (currentHall.city ? ' · ' + currentHall.city : '');
    document.getElementById('bookings-list').innerHTML =
      '<div class="empty-bookings">Loading…</div>';
    showOnly(bookingsView);

    try {
      const url = apiURL + '/hall-bookings?hall_id=' +
        encodeURIComponent(currentHall.hall_id) + '&date=' + encodeURIComponent(dateStr);
      const resp = await fetch(url, { headers: { 'X-Init-Data': tg ? tg.initData : '' } });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        document.getElementById('bookings-list').innerHTML =
          '<div class="empty-bookings">Error: ' + esc(data.error || resp.status) + '</div>';
        return;
      }
      renderBookings(data.bookings || [], dateStr);
    } catch (e) {
      document.getElementById('bookings-list').innerHTML =
        '<div class="empty-bookings">Network error: ' + esc(e.message) + '</div>';
    }
  }
  function renderBookings(bookings, dateStr) {
    const list = document.getElementById('bookings-list');
    if (!bookings.length) {
      list.innerHTML = '<div class="empty-bookings">No bookings.</div>';
      return;
    }
    list.innerHTML = bookings.map((b) =>
      '<div class="booking-row" data-booking="' + esc(b.booking_id) + '" data-date="' + esc(b.date) + '">' +
        '<div class="info">' +
          '<b>' + esc(b.time_of_start) + ':00 · ' + esc(String(b.duration)) + 'h</b>' +
          '🪑 ' + esc(String(b.number_of_tables)) + ' table(s) · 👤 ' + esc(b.user_id) +
        '</div>' +
        '<button class="cancel-btn" type="button">Cancel</button>' +
      '</div>'
    ).join('');
    list.querySelectorAll('.booking-row').forEach((row) => {
      const btn = row.querySelector('.cancel-btn');
      btn.addEventListener('click', () => cancelBooking(row, btn));
    });
  }

  async function cancelBooking(rowEl, btnEl) {
    const bookingID = rowEl.getAttribute('data-booking');
    const date = rowEl.getAttribute('data-date');
    // Prefer Telegram's native confirm; fall back to the browser one when
    // tg.showConfirm is unavailable (older clients, local dev in a browser).
    const confirmed = await new Promise((resolve) => {
      if (tg && typeof tg.showConfirm === 'function') {
        tg.showConfirm('Cancel this booking?', (ok) => resolve(!!ok));
      } else {
        resolve(window.confirm('Cancel this booking?'));
      }
    });
    if (!confirmed) return;

    btnEl.disabled = true;
    btnEl.textContent = 'Cancelling…';
    try {
      const resp = await fetch(apiURL + '/cancel-booking', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Init-Data': tg ? tg.initData : '',
        },
        body: JSON.stringify({ booking_id: bookingID, date: date }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        btnEl.disabled = false;
        btnEl.textContent = 'Cancel';
        if (tg && typeof tg.showAlert === 'function') {
          tg.showAlert('Cancel failed: ' + (data.error || resp.status));
        } else {
          alert('Cancel failed: ' + (data.error || resp.status));
        }
        return;
      }
      // Fade the row out instead of leaving dead UI behind.
      rowEl.style.transition = 'opacity 0.3s';
      rowEl.style.opacity = '0.3';
      btnEl.textContent = 'Cancelled';
    } catch (e) {
      btnEl.disabled = false;
      btnEl.textContent = 'Cancel';
      if (tg && typeof tg.showAlert === 'function') {
        tg.showAlert('Network error: ' + e.message);
      } else {
        alert('Network error: ' + e.message);
      }
    }
  }

  // Navigation glue.
  document.getElementById('new-claim-btn').addEventListener('click', showClaim);
  document.getElementById('hall-back-btn').addEventListener('click', () => showHome());
  document.getElementById('date-back-btn').addEventListener('click', () => showOnly(hallView));
  document.getElementById('bookings-back-btn').addEventListener('click', () => showOnly(hallView));
  document.getElementById('menu-today').addEventListener('click', () => showBookings(todayStr()));
  document.getElementById('menu-date').addEventListener('click', showDatePicker);

  async function routeOnLoad() {
    if (!inTelegram) {
      // No initData → can't call authenticated endpoints. Just show the
      // claim form; submit will show a friendly error.
      showClaim();
      return;
    }
    try {
      const resp = await fetch(apiURL + '/my-halls', {
        method: 'GET',
        headers: { 'X-Init-Data': tg.initData },
      });
      if (!resp.ok) {
        console.error('my-halls returned', resp.status);
        showClaim();
        return;
      }
      const data = await resp.json();
      const halls = (data && data.halls) || [];
      if (halls.length === 0) {
        showClaim();
      } else {
        showHome(halls);
      }
    } catch (e) {
      console.error('my-halls failed:', e);
      showClaim();
    }
  }
  // Fire after Leaflet init below so map/invalidateSize is safe.

  // Default view: broad enough to be useful, admin re-centers via locate button or map tap.
  let marker = null;
  console.log('creating map');
  const map = L.map('map', { zoomControl: true }).setView([41.65, 41.63], 11); // Batumi-ish
  console.log('map created');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap',
  }).addTo(map);
  console.log('tiles added');

  routeOnLoad();

  function placeMarker(lat, lon) {
    if (marker) {
      marker.setLatLng([lat, lon]);
    } else {
      marker = L.marker([lat, lon], { draggable: true }).addTo(map);
      marker.on('dragend', () => {
        const ll = marker.getLatLng();
        autoFillAddress(ll.lat, ll.lng);
      });
    }
    autoFillAddress(lat, lon);
  }
  map.on('click', (e) => { placeMarker(e.latlng.lat, e.latlng.lng); });

  // Reverse-geocode the pin to a street-level address and drop it into the
  // address field — but only when the field is empty, so manual edits win.
  // zoom=18 gives building-level detail (vs. zoom=10 the main bot uses for
  // city-only resolution).
  const addrInput = document.getElementById('address');
  let geocodeSeq = 0;
  async function autoFillAddress(lat, lng) {
    if (addrInput.value.trim() !== '') return;
    const seq = ++geocodeSeq;
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json' +
        '&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1&accept-language=en';
      const resp = await fetch(url);
      if (!resp.ok) return;
      const data = await resp.json();
      // Guard against out-of-order responses: a slow earlier call shouldn't
      // overwrite a later pin's result, and we still skip if user has typed.
      if (seq !== geocodeSeq || addrInput.value.trim() !== '') return;
      const formatted = buildAddressFromParts(data && data.address);
      if (formatted) addrInput.value = formatted;
    } catch (e) {
      console.error('reverse geocode failed:', e);
    }
  }

  // Build "<house_number> <road>, <city>, <country>" from Nominatim's
  // structured address, skipping the business/amenity name that
  // display_name usually leads with (e.g. "McShawarma, 15 Rustaveli…" →
  // just "15 Rustaveli…"). Falls back gracefully when parts are missing.
  function buildAddressFromParts(a) {
    if (!a) return '';
    const street = [a.house_number, a.road].filter(Boolean).join(' ');
    const city = a.city || a.town || a.village || a.state || '';
    const country = a.country || '';
    return [street, city, country].filter(Boolean).join(', ');
  }

  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) { showError('Geolocation not supported by this browser.'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        map.setView([lat, lon], 16);
        placeMarker(lat, lon);
      },
      (err) => showError('Could not get location: ' + err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // Photo picker with preview + base64 conversion.
  let photoB64 = null;
  const photoInput = document.getElementById('photo');
  const photoPreview = document.getElementById('photo-preview');
  const photoPlaceholder = document.getElementById('photo-placeholder');
  photoInput.addEventListener('change', () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      showError('Photo too large (max 10 MB).');
      photoInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      photoB64 = reader.result;
      photoPreview.src = photoB64;
      photoPreview.style.display = 'block';
      photoPlaceholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  const submitBtn = document.getElementById('submit');
  submitBtn.addEventListener('click', onSubmit);

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearError() { document.getElementById('error').style.display = 'none'; }

  async function onSubmit() {
    clearError();
    if (!inTelegram) { showError('Please open this page from inside the admin bot.'); return; }

    const address = document.getElementById('address').value.trim();
    const tables = parseInt(document.getElementById('tables').value, 10);
    if (!address) { showError('Address is required.'); return; }
    if (!marker) { showError('Pick a location on the map.'); return; }
    if (!tables || tables < 1) { showError('Enter a valid number of tables.'); return; }
    if (!photoB64) { showError('Pick a photo of the hall.'); return; }

    const { lat, lng } = marker.getLatLng();
    const body = {
      address,
      latitude: lat,
      longitude: lng,
      tables,
      photo: photoB64,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    try {
      const resp = await fetch(apiURL + '/claim-submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Init-Data': tg.initData,
        },
        body: JSON.stringify(body),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        showError(data.error || ('Error ' + resp.status));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit for review';
        return;
      }
      document.getElementById('form').style.display = 'none';
      document.querySelector('.submit-area').style.display = 'none';
      const done = document.getElementById('done');
      done.textContent = '✅ Submitted for review. City: ' + (data.city || '(unknown)');
      done.style.display = 'block';
      setTimeout(() => { tg && tg.close && tg.close(); }, 2500);
    } catch (e) {
      showError('Network error: ' + e.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit for review';
    }
  }
})();
</script>
</body>
</html>
